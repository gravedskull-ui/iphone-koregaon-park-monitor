name: Apple Pickup Monitor - Koregaon Park

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "7/10 * * * *"

permissions: 
  contents: write

concurrency:
  group: apple-pickup-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Apple pickup availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}
        run: python monitor.py

      - name: Commit state change
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/status.json

          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi

          git commit -m "Update Apple pickup monitor state"
          git push
